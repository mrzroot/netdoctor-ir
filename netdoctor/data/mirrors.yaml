# Package / registry mirrors tested by `netdoctor mirrors`.
#
# ecosystem:     pypi | npm | docker | go | maven
#   pypi   -> url is a PEP 503 "simple" index root  (…/simple)
#   npm    -> url is an npm registry root
#   docker -> url is a registry mirror root (must answer /v2/)
#   go     -> url is a GOPROXY root
#   maven  -> url is a Maven repository root
# verification:  official | documented | community-reported
#   "documented" = the operator's own page/docs list this exact endpoint.
#   "community-reported" = taken from community lists only; nobody has confirmed it from
#   inside Iran yet. Many Iranian mirrors refuse foreign clients, so maintainers outside
#   Iran cannot verify them. Open a PR with evidence to upgrade an entry.
# source:        where the entry came from.
#
# Sources used for the initial catalog (Oct 2026):
#   - https://github.com/MiravaOrg/Mirava  (curated list of Iranian mirrors)
#   - https://mirrors.arash-hatami.ir/     (open-source mirror directory)
#   - operators' own pages where linked below
schema: 1
mirrors:
  # ---------------------------------------------------------------- PyPI
  - id: pypi-official
    name: PyPI (upstream)
    provider: Python Software Foundation
    ecosystem: pypi
    url: https://pypi.org/simple
    country: global
    verification: official
  - id: pypi-liara
    name: Liara PyPI
    provider: Liara
    ecosystem: pypi
    url: https://package-mirror.liara.ir/repository/pypi/simple
    verification: documented
    source: https://liara.ir/mirrors/pypi/
  - id: pypi-runflare
    name: Runflare PyPI
    provider: Runflare
    ecosystem: pypi
    url: https://mirror-pypi.runflare.com/simple
    verification: documented
    source: https://docs.runflare.com/mirror/pypi-mirror/
    note: Operator advertises a free per-IP request quota.
  - id: pypi-chabokan
    name: Chabokan PyPI
    provider: Chabokan
    ecosystem: pypi
    url: https://mirror2.chabokan.net/registry/pypi/simple
    source: https://mirrors.arash-hatami.ir/
  - id: pypi-kargadan
    name: Kargadan PyPI
