[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "netdoctor-ir"
dynamic = ["version"]
description = "Connectivity doctor and mirror switcher for developers in Iran: diagnose filtering & sanctions, benchmark DNS resolvers, and switch pip/npm/Docker/Go to working mirrors."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Mohammadreza Zare", email = "155621094+mrzroot@users.noreply.github.com" }]
keywords = [
  "iran", "network", "diagnostics", "dns", "mirrors", "sanctions", "pypi", "npm",
  "docker", "goproxy", "cli", "developer-tools",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: Name Service (DNS)",
  "Topic :: System :: Networking :: Monitoring",
  "Topic :: Software Development :: Build Tools",
  "Typing :: Typed",
]
dependencies = [
  "dnspython>=2.4",
  "httpx>=0.25",
  "pyyaml>=6.0",
  "rich>=13.5",
  "typer>=0.12",
]

[project.optional-dependencies]
tui = ["textual>=0.60"]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "respx>=0.21",
  "ruff>=0.6",
  "mypy>=1.10",
  "types-PyYAML",
  "build>=1.2",
  "textual>=0.60",
]

[project.scripts]
netdoctor = "netdoctor.cli:main"

[project.urls]
Homepage = "https://mrzroot.github.io/netdoctor-ir/"
Repository = "https://github.com/mrzroot/netdoctor-ir"
Issues = "https://github.com/mrzroot/netdoctor-ir/issues"
Changelog = "https://github.com/mrzroot/netdoctor-ir/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "netdoctor/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["netdoctor"]

[tool.hatch.build.targets.sdist]
include = ["netdoctor", "tests", "README.md", "LICENSE", "CHANGELOG.md", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "C4", "PTH", "RET", "ASYNC", "N"]
ignore = ["RUF001", "RUF002", "RUF003", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PTH", "RUF012"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
source = ["netdoctor"]
branch = true
omit = ["netdoctor/tui.py", "netdoctor/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
ignore_missing_imports = true
